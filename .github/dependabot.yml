version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Dependabot does not open PRs against `overrides` entries, so the pinned
      # axios override in package.json has nothing watching it. This group is the
      # trigger: whenever a @coinbase/cdp-sdk bump lands here, re-check whether the
      # SDK's own axios range now resolves to a patched release and drop the
      # override if it does. See docs/architecture/001-coinbase-crypto-payment-rail.md.
      coinbase-minor-and-patch:
        patterns:
          - "@coinbase/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

name: CodeQL

on:
  push:
    branches: [main]
  # No branch filter: the Coinbase work lands as a stack of PRs based on each
  # other rather than on main, and a `branches: [main]` filter here silently gave
  # every one of them zero CI -- no lint, no type check, no tests -- until the
  # base was retargeted. Running on every pull request costs nothing extra and
  # keeps a stacked PR as well covered as a direct one.
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
